<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="15x8 is a sliding puzzle with an eight-puzzle inside every move.">
  <title>15x8</title>
  <link rel="stylesheet" href="game.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><time id="timer" aria-label="Elapsed time">0.000</time>s</div>
      <div class="move-counters">
        <output id="outer-moves" aria-label="4 by 4 moves">0</output>
        <output id="inner-moves" aria-label="Total 3 by 3 moves">0</output>
        <div class="copy-result">
          <button id="copy-result" type="button" aria-label="Copy result">
            <span class="copy-icon" aria-hidden="true"></span>
          </button>
          <span id="copy-status" role="status"></span>
        </div>
      </div>
    </header>
    <div id="board" role="group" aria-label="Sliding puzzle" tabindex="0"></div>
  </main>
</body>
</html>
